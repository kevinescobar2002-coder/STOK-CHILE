document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    // Web publicada: los errores van solo a la consola (p. ej. scripts que inyecta
    // el navegador de Instagram/Facebook). Para ver el recuadro, agrega ?debug a la URL.
    if (!new URLSearchParams(location.search).has('debug')) {
      console.error('[bundle]', e.message || e.type, e.filename || '', e.lineno || '');
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nu }}\" aria-label=\"{{ menuLabel }}\" aria-expanded=\"{{ menuExpanded }}\" aria-controls=\"menu-principal\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<section id=\"top\" data-screen-label=\"01 Hero\" style=\"background:var(--gradient-cover);overflow:hidden\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:128px 24px 0\">\n    <div style=\"padding-bottom:128px;max-width:880px\">\n      <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Eyebrow\" tone=\"signal-dark\" hint-size=\"320px,16px\">Control de bodega para obras · Chile<\u002Fx-import>\n      <h1 style=\"margin:16px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(48px,7vw,84px);line-height:.92;letter-spacing:-0.01em;text-transform:uppercase;color:var(--text-on-dark);text-wrap:balance\">Controla tu bodega, <span style=\"color:var(--stok-signal)\">controla tu STOK.<\u002Fspan><\u002Fh1>\n      <p style=\"margin:24px 0 0;max-width:600px;font-size:20px;line-height:1.5;color:var(--text-on-dark-2);text-wrap:pretty\">Los datos de la bodega dejaron de registrarse a mano. <b style=\"color:var(--text-on-dark);font-weight:600\">STOK automatiza todo el control de tu inventario<\u002Fb>, captura cada material que se mueve y anticipa lo que va a faltar antes de que detenga la obra.<\u002Fp>\n      <div style=\"display:flex;gap:12px;margin-top:32px;flex-wrap:wrap\">\n        <a href=\"#contacto\" style=\"display:flex\"><x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Button\" size=\"lg\" hint-size=\"240px,52px\">Agenda una visita a obra<\u002Fx-import><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:32px;margin-top:48px;padding-top:24px;border-top:1px solid var(--border-dark);flex-wrap:wrap\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-family:var(--font-display);font-weight:800;font-size:36px;line-height:1;color:var(--stok-signal)\">−40%<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-on-dark-2)\">quiebres de stock · meta piloto<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <span style=\"font-family:var(--font-display);font-weight:800;font-size:36px;line-height:1;color:var(--text-on-dark)\">24/7<\u002Fspan>\n          <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-on-dark-2)\">captura automática<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"problema\" data-screen-label=\"02 Problema\" style=\"background:var(--stok-niebla)\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:128px 24px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:end;margin-bottom:48px\">\n      <div>\n        <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Eyebrow\" hint-size=\"140px,16px\">El problema<\u002Fx-import>\n        <h2 style=\"margin:12px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(36px,4.4vw,52px);line-height:.95;text-transform:uppercase;color:var(--text-primary);text-wrap:balance\">La obra no se detiene por falta de recursos. <span style=\"color:var(--stok-signal)\">Se detiene por falta de datos.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n      <div style=\"background:var(--stok-signal);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(48px,5vw,72px);line-height:.9;white-space:nowrap;color:var(--stok-marino)\">6 de 10<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.45;font-weight:600;color:var(--stok-marino)\">obras pierden materiales por falta de control.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(48px,5vw,72px);line-height:.9;white-space:nowrap;color:var(--text-primary)\">92%<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.45;color:var(--text-secondary)\">hace compras urgentes no planificadas.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(48px,5vw,72px);line-height:.9;white-space:nowrap;color:var(--text-primary)\">75%<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.45;color:var(--text-secondary)\">pierde tiempo excesivo buscando elementos.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:16px\">\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(48px,5vw,72px);line-height:.9;white-space:nowrap;color:var(--text-primary)\">71%<\u002Fspan>\n        <span style=\"font-size:16px;line-height:1.45;color:var(--text-secondary)\">tiene herramientas no devueltas.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:16px 0 0;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-secondary)\">Porcentajes sobre las obras afectadas · levantamiento propio STOK<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"sala\" data-screen-label=\"05 Sala de control\" style=\"background:#fff\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:128px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:64px;align-items:center\">\n    <div>\n      <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Eyebrow\" hint-size=\"160px,16px\">Sala de control<\u002Fx-import>\n      <h2 style=\"margin:12px 0 16px;font-family:var(--font-display);font-weight:800;font-size:clamp(36px,4.4vw,52px);line-height:.95;text-transform:uppercase;color:var(--text-primary);text-wrap:balance\">Tu bodega en el bolsillo. <span style=\"color:var(--stok-signal)\">Antes de que falte.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0 0 32px;font-size:18px;line-height:1.55;color:var(--text-secondary);max-width:480px\">Web y app móvil. Stock, movimientos y alertas de cada obra en un solo lugar, con la proyección del día en que se acaba cada material.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px\">\n        <div style=\"background:var(--stok-niebla);border:1px solid var(--border-light);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n          <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Icon\" name=\"triangle-alert\" color=\"#F5620F\" size=\"{{ 24 }}\" hint-size=\"24px,24px\"><\u002Fx-import>\n          <span style=\"font-weight:600;font-size:16px\">Proyección de quiebres<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.45;color:var(--text-secondary)\">Cuántos días le quedan a cada material.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--stok-niebla);border:1px solid var(--border-light);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n          <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Icon\" name=\"scan-line\" color=\"#F5620F\" size=\"{{ 24 }}\" hint-size=\"24px,24px\"><\u002Fx-import>\n          <span style=\"font-weight:600;font-size:16px\">Movimientos en vivo<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.45;color:var(--text-secondary)\">Cada salida con hora, zona y responsable.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--stok-niebla);border:1px solid var(--border-light);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n          <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Icon\" name=\"package\" color=\"#F5620F\" size=\"{{ 24 }}\" hint-size=\"24px,24px\"><\u002Fx-import>\n          <span style=\"font-weight:600;font-size:16px\">Aprobar compra<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.45;color:var(--text-secondary)\">La reposición sale con un toque.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:var(--stok-niebla);border:1px solid var(--border-light);border-radius:6px;padding:24px;display:flex;flex-direction:column;gap:10px\">\n          <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Icon\" name=\"bell\" color=\"#F5620F\" size=\"{{ 24 }}\" hint-size=\"24px,24px\"><\u002Fx-import>\n          <span style=\"font-weight:600;font-size:16px\">Aviso al capataz<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.45;color:var(--text-secondary)\">La alerta llega a quien tiene que actuar.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"06 Manifiesto\" style=\"background:var(--stok-marino)\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:128px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center\">\n    <h2 style=\"margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(44px,6vw,80px);line-height:.92;text-transform:uppercase;color:var(--text-on-dark)\">No ofrecemos sensores. <span style=\"color:var(--stok-signal)\">Ofrecemos decisiones.<\u002Fspan><\u002Fh2>\n    <div style=\"border-left:1px solid var(--border-dark);padding-left:48px\">\n      <div style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(96px,14vw,180px);line-height:.8;color:var(--stok-signal)\">+30%<\u002Fdiv>\n      <div style=\"margin:16px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(32px,4vw,52px);line-height:.95;text-transform:uppercase;color:var(--text-on-dark)\">Productividad<\u002Fdiv>\n      <p style=\"margin:12px 0 0;font-size:18px;line-height:1.5;color:var(--text-on-dark-2)\">de tu proyecto.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showPlanes }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"planes\" data-screen-label=\"07 Planes\" style=\"background:#fff\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:128px 24px\">\n    <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Eyebrow\" hint-size=\"140px,16px\">Cómo empezar<\u002Fx-import>\n    <h2 style=\"margin:12px 0 48px;font-family:var(--font-display);font-weight:800;font-size:clamp(36px,4.4vw,52px);line-height:.95;text-transform:uppercase;color:var(--text-primary);max-width:760px;text-wrap:balance\">De la visita a la bodega <span style=\"color:var(--stok-signal)\">controlada.<\u002Fspan><\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n      <div style=\"background:var(--stok-niebla);border:1px solid var(--border-light);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--text-signal)\">01 · Visita a obra<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(26px,2.8vw,40px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere\">Diagnóstico<\u002Fspan>\n        <p style=\"margin:0;font-size:16px;line-height:1.5;color:var(--text-secondary)\">Recorremos tu bodega, vemos qué se pierde y dónde van el pórtico y las cámaras.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--stok-niebla);border:1px solid var(--border-light);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--text-signal)\">02 · Instalación<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(26px,2.8vw,40px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere\">Montaje<\u002Fspan>\n        <p style=\"margin:0;font-size:16px;line-height:1.5;color:var(--text-secondary)\">Montamos el equipamiento y dejamos la bodega leyendo desde el primer día.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:var(--stok-marino);border:1px solid var(--stok-marino);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--stok-signal)\">03 · Operación<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(26px,2.8vw,40px);line-height:1;text-transform:uppercase;overflow-wrap:anywhere;color:var(--stok-signal)\">Costo base<\u002Fspan>\n        <p style=\"margin:0 0 12px;font-size:16px;line-height:1.5;color:var(--text-on-dark-2)\">Un costo base mensual según la cantidad de activos de tu bodega. Captura automática, Sala de control y alertas incluidas.<\u002Fp>\n        <a href=\"#contacto\" style=\"display:flex;margin-top:auto\"><x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Button\" hint-size=\"160px,40px\">Súmate a STOK<\u002Fx-import><\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section id=\"equipo\" data-screen-label=\"08 Equipo\" style=\"background:var(--stok-niebla)\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:128px 24px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:end;margin-bottom:48px\">\n      <div>\n        <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Eyebrow\" hint-size=\"140px,16px\">Quiénes somos<\u002Fx-import>\n        <h2 style=\"margin:12px 0 0;font-family:var(--font-display);font-weight:800;font-size:clamp(36px,4.4vw,52px);line-height:.95;text-transform:uppercase;color:var(--text-primary)\">Nacimos <span style=\"color:var(--stok-signal)\">en terreno.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;color:var(--text-secondary);max-width:480px;text-wrap:pretty\">Entre bodegas que todavía se controlan a mano y obras que se detienen por planillas atrasadas. Creemos que el dato debe nacer solo, sin depender de que alguien se acuerde de anotarlo.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px\">\n      <div style=\"background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-signal)\">Finanzas y piloto<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase\">Joaquín González<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--text-secondary)\">Planificación presupuestaria, evaluación económica y coordinación de la implementación en obra.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-signal)\">Plataforma y datos<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase\">Kevin Escobar<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--text-secondary)\">Arquitectura de datos, sistemas de análisis e integraciones que convierten cada registro en una decisión.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid var(--border-light);border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:12px\">\n        <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-signal)\">Hardware y terreno<\u002Fspan>\n        <span style=\"font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1;text-transform:uppercase\">Gustavo Fierro<\u002Fspan>\n        <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--text-secondary)\">Instalación del pórtico, puesta en marcha en cada obra y calidad de la captura desde su origen.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contacto\" data-screen-label=\"09 Contacto\" style=\"background:var(--gradient-closing)\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:128px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:64px;align-items:center\">\n    <div>\n      <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Eyebrow\" tone=\"signal-dark\" hint-size=\"100px,16px\">Súmate<\u002Fx-import>\n      <h2 style=\"margin:12px 0 16px;font-family:var(--font-display);font-weight:800;font-size:clamp(34px,5vw,60px);line-height:.95;text-transform:uppercase;color:var(--text-on-dark);text-wrap:balance\">Digitalicemos el futuro de la <span style=\"color:var(--stok-signal)\">construcción.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0;font-size:18px;line-height:1.55;color:var(--text-on-dark-2);max-width:440px\">Déjanos tus datos y agendamos una visita a tu obra.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border-radius:6px;padding:32px;display:flex;flex-direction:column;gap:16px\">\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Icon\" name=\"circle-check\" color=\"#0B7F57\" size=\"{{ 32 }}\" hint-size=\"32px,32px\"><\u002Fx-import>\n          <span style=\"font-family:var(--font-display);font-weight:800;font-size:28px;text-transform:uppercase\">Listo.<\u002Fspan>\n          <span style=\"font-size:16px;line-height:1.5;color:var(--text-secondary)\">Te escribimos para agendar la visita a tu obra.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Input\" label=\"Nombre\" placeholder=\"Tu nombre\" value=\"{{ nombre }}\" on-change=\"{{ setNombre }}\" error=\"{{ errNombre }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Input\" label=\"Correo de la constructora\" type=\"email\" placeholder=\"nombre@constructora.cl\" value=\"{{ correo }}\" on-change=\"{{ setCorreo }}\" error=\"{{ errCorreo }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Input\" label=\"Obra\" placeholder=\"Nombre y comuna de la obra\" value=\"{{ obra }}\" on-change=\"{{ setObra }}\" hint-size=\"100%,64px\"><\u002Fx-import>\n        <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Button\" size=\"lg\" full-width=\"{{ true }}\" disabled=\"{{ enviando }}\" on-click=\"{{ send }}\" hint-size=\"100%,52px\">{{ sendLabel }}<\u002Fx-import>\n        <sc-if value=\"{{ fallo }}\" hint-placeholder-val=\"{{ false }}\">\n          <p role=\"alert\" style=\"margin:0;font-size:14px;line-height:1.45;color:var(--stok-alert)\">{{ fallo }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background:var(--stok-marino-deep);border-top:1px solid var(--border-dark)\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:32px 24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-on-dark-2)\">\n    <x-import component-from-global-scope=\"STOKDesignSystem_fbf0b1.Logo\" on-dark=\"{{ true }}\" height=\"{{ 22 }}\" base=\"web/\" hint-size=\"76px,22px\"><\u002Fx-import>\n    <span>Controla tu bodega, controla tu STOK.<\u002Fspan>\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n      <a href=\"#contacto\" style=\"color:var(--text-on-dark-2)\">Agenda una visita<\u002Fa>\n      <a href=\"https://www.instagram.com/stok.cl\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--text-on-dark-2)\">@stok.cl<\u002Fa>\n      <span>© 2026 STOK<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showPlanes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  state = { sent: false, menu: false, nombre: '', correo: '', obra: '', enviando: false, errores: {}, fallo: '' };\n\n  // Los contactos llegan por correo vía FormSubmit (formsubmit.co).\n  // La primera vez FormSubmit manda un correo de activación a esta dirección.\n  static DESTINO = 'https://formsubmit.co/ajax/kevinescobar2002@gmail.com';\n\n  async enviar() {\n    if (this.state.enviando) return;\n    const nombre = this.state.nombre.trim();\n    const correo = this.state.correo.trim();\n    const obra = this.state.obra.trim();\n    const errores = {};\n    if (!nombre) errores.nombre = 'Escribe tu nombre.';\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(correo)) errores.correo = 'Revisa el correo.';\n    if (Object.keys(errores).length) {\n      this.setState({ errores, fallo: '' });\n      return;\n    }\n    this.setState({ errores: {}, fallo: '', enviando: true });\n    try {\n      const r = await fetch(Component.DESTINO, {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },\n        body: JSON.stringify({\n          Nombre: nombre,\n          Correo: correo,\n          Obra: obra || '(sin indicar)',\n          _subject: 'Nueva visita a obra · stokchile.cl',\n          _replyto: correo,\n          _template: 'table',\n          _captcha: 'false'\n        })\n      });\n      const j = await r.json().catch(() => ({}));\n      if (!r.ok || String(j.success) !== 'true') throw new Error(j.message || 'HTTP ' + r.status);\n      this.setState({ sent: true, enviando: false });\n    } catch (e) {\n      console.error('[contacto]', e);\n      this.setState({ enviando: false, fallo: 'No pudimos enviar tus datos. Intenta de nuevo o escríbenos por Instagram a @stok.cl.' });\n    }\n  }\n\n  renderVals() {\n    return {\n      showPlanes: this.props.showPlanes ?? true,\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      nombre: this.state.nombre,\n      correo: this.state.correo,\n      obra: this.state.obra,\n      setNombre: (e) => this.setState({ nombre: e.target.value }),\n      setCorreo: (e) => this.setState({ correo: e.target.value }),\n      setObra: (e) => this.setState({ obra: e.target.value }),\n      errNombre: this.state.errores.nombre || '',\n      errCorreo: this.state.errores.correo || '',\n      enviando: this.state.enviando,\n      fallo: this.state.fallo,\n      sendLabel: this.state.enviando ? 'Enviando…' : 'Agenda una visita a obra',\n      send: () => this.enviar(),\n      navClass: this.state.menu ? 'site-nav abierto' : 'site-nav',\n      toggleClass: this.state.menu ? 'nav-toggle abierto' : 'nav-toggle',\n      menuExpanded: this.state.menu ? 'true' : 'false',\n      menuLabel: this.state.menu ? 'Cerrar menú' : 'Abrir menú',\n      toggleMenu: () => this.setState({ menu: !this.state.menu }),\n      closeMenu: () => this.state.menu && this.setState({ menu: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
